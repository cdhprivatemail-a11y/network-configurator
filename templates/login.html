<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统安全登录 - 网络批量配置器 Enterprise</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 460px;
            width: 100%;
        }
        .role-pill {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .role-pill:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }
    </style>
</head>
<body>
<div class="container p-3">
    <div class="login-card mx-auto p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-25 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold tracking-wide mb-1 text-white">网络批量配置器</h3>
            <p class="text-secondary small mb-0">Enterprise v5.0 · 零信任生产安全接入控制</p>
        </div>

        <div id="loginAlert" class="alert alert-danger py-2 small" style="display: none;"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label small text-light-50">登录账号 / Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person-fill"></i></span>
                    <input type="text" id="username" class="form-control bg-dark border-secondary text-white" placeholder="admin / operator / auditor" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small text-light-50">安全口令 / Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key-fill"></i></span>
                    <input type="password" id="password" class="form-control bg-dark border-secondary text-white" placeholder="请输入口令" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-1"></i> 安全登录系统
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary border-opacity-50">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="small text-secondary fw-semibold">快速填充三权预置角色：</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary role-pill" onclick="quickFill('admin', 'Admin@2026!')">
                    <i class="bi bi-person-gear me-1"></i>超管 (admin)
                </button>
                <button type="button" class="btn btn-sm btn-outline-info role-pill" onclick="quickFill('operator', 'Operator@2026!')">
                    <i class="bi bi-terminal me-1"></i>运维 (operator)
                </button>
                <button type="button" class="btn btn-sm btn-outline-warning role-pill" onclick="quickFill('auditor', 'Auditor@2026!')">
                    <i class="bi bi-shield-check me-1"></i>审计 (auditor)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function quickFill(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
    document.getElementById('loginAlert').style.display = 'none';
}

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const alertBox = document.getElementById('loginAlert');
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 鉴权验证中...';
    alertBox.style.display = 'none';

    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
            // 保存 token 到 localStorage 供 API 调用备用
            if (data.token) {
                localStorage.setItem('auth_token', data.token);
            }
            const urlParams = new URLSearchParams(window.location.search);
            const nextUrl = urlParams.get('next') || '/';
            window.location.href = nextUrl;
        } else {
            alertBox.textContent = data.error || '用户名或密码错误，请核对后再试！';
            alertBox.style.display = 'block';
        }
    } catch (err) {
        alertBox.textContent = '登录通信异常: ' + err.message;
        alertBox.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> 安全登录系统';
    }
}
</script>
</body>
</html>
